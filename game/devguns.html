<!DOCTYPE html><html><head><script type="importmap">{ "imports": { "three": "./js/three.module.min.js" } }</script></head>
<body style="margin:0"><canvas id="c" width="1600" height="1000"></canvas>
<script type="module">
import * as THREE from 'three';
import { detailedGun } from './js/guns3d.js';
import { RoomEnvironment } from './js/pp/environments/RoomEnvironment.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1;
const s = new THREE.Scene(); s.background = new THREE.Color(0x2a2b2e);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(1, 3, 4); s.add(d); s.add(new THREE.HemisphereLight(0xffffff, 0x333333, 0.6));
const ids = (new URLSearchParams(location.search).get('ids') || 'akm,m4a1,aks74u,scarh,fal,mosin,scout,r870,dbarrel,tommy,ump45,mp7,uzi,mac10,tec9,g17,m1911,deagle,magnum,beretta').split(',');
const cols = 4;
ids.forEach((id, i) => { const g = detailedGun(id === 'dbarrel' ? 'doublebarrel' : id); if (!g) return; g.rotation.y = -Math.PI / 2; const big = ['akm','m4a1','scarh','fal','mosin','scout','r870','tommy','sks','dbarrel','aks74u','ump45'].includes(id); g.scale.setScalar(big ? 1 : 1.8); g.position.set(-1.65 + (i % cols) * 1.1, 1.55 - Math.floor(i / cols) * 0.62, 0); s.add(g); });
const cam = new THREE.PerspectiveCamera(30, 1.6, 0.01, 50); cam.position.set(0, 0.35, 5.2); cam.lookAt(0, 0.35, 0);
r.render(s, cam); window.done = true;
</script></body></html>

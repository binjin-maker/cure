<!DOCTYPE html><html><head><script type="importmap">{ "imports": { "three": "./js/three.module.min.js" } }</script></head>
<body style="margin:0;background:#556"><canvas id="c" width="1200" height="700"></canvas>
<script type="module">
import * as THREE from 'three';
import { loadAssets, gunModel } from './js/assets.js';
import { makeChar, randomOutfit } from './js/chars.js';
import { ITEM } from './js/data.js';
import { RoomEnvironment } from './js/pp/environments/RoomEnvironment.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.toneMapping = THREE.ACESFilmicToneMapping;
const s = new THREE.Scene(); s.background = new THREE.Color(0x667080);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
s.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 5, 4); s.add(d);
await loadAssets();
const cam = new THREE.PerspectiveCamera(35, 1200 / 700, 0.01, 100);
const ids = ['g17', 'deagle', 'uzi', 'akm', 'm4a1', 'r870', 'scout', 'tommy'];
ids.forEach((id, i) => { const g = gunModel(ITEM[id]); g.position.set(-2.4 + (i % 4) * 1.3, 2.6 - Math.floor(i / 4) * 0.6, 0); g.rotation.y = -Math.PI / 2; s.add(g); });
const outfits = [0, 1, 2, 3, 4].map(() => randomOutfit());
outfits.forEach((o, i) => { const c = makeChar(o); c.position.set(-2.4 + i * 1.2, 0, 0); c.rotation.y = i === 4 ? Math.PI * 0.8 : 0.3; c.userData.play('idle'); c.userData.mixer.update(0.5); if (i === 3) { c.userData.setHeld(ITEM.akm, () => new THREE.Group()); const p = c.userData.parts; p['arm-right'].rotation.set(-Math.PI / 2, -0.1, 0); p['arm-left'].rotation.set(-Math.PI / 2 + 0.1, 0.75, 0); } s.add(c); });
s.rotation.y = 0;
cam.position.set(0, 1.6, 7.5); cam.lookAt(0, 1.4, 0);
r.render(s, cam); window.done = true;
</script></body></html>
